name: Library Management CI/CD


# --------------------------------
# WHEN PIPELINE SHOULD RUN
# --------------------------------

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# --------------------------------
# PERMISSIONS
# --------------------------------

permissions:

  contents: read

  pages: write

  id-token: write


# --------------------------------
# JOBS
# --------------------------------

jobs:


  # ==================================
  # BUILD
  # ==================================

  build:

    name: Build Application

    runs-on: ubuntu-latest


    steps:

      - name: Checkout Source Code

        uses: actions/checkout@v4


      - name: Create Build Directory

        run: mkdir -p dist


      - name: Copy Application Files

        run: |

          cp index.html dist/

          cp style.css dist/

          cp script.js dist/


      - name: Build Successful

        run: echo "Library Management System build completed."


      - name: Upload Build Artifact

        uses: actions/upload-artifact@v4

        with:

          name: library-build

          path: dist/



  # ==================================
  # TEST
  # ==================================

  test:

    name: Test Application

    runs-on: ubuntu-latest

    needs: build


    steps:

      - name: Checkout Source Code

        uses: actions/checkout@v4


      - name: Check HTML File

        run: test -f index.html


      - name: Check CSS File

        run: test -f style.css


      - name: Check JavaScript File

        run: test -f script.js


      - name: Check Application Title

        run: grep -q "Library Management System" index.html


      - name: Check JavaScript Function

        run: grep -q "deleteBook" script.js


      - name: Tests Successful

        run: echo "All application tests passed."



  # ==================================
  # PACKAGE
  # ==================================

  package:

    name: Package Application

    runs-on: ubuntu-latest

    needs: test


    steps:

      - name: Checkout Source Code

        uses: actions/checkout@v4


      - name: Create Package Directory

        run: mkdir package


      - name: Copy Application Files

        run: |

          cp index.html package/

          cp style.css package/

          cp script.js package/

          cp README.md package/


      - name: Create ZIP Package

        run: zip -r library-management-system.zip package/


      - name: Upload Package

        uses: actions/upload-artifact@v4

        with:

          name: library-package

          path: library-management-system.zip



  # ==================================
  # DEPLOY
  # ==================================

  deploy:

    name: Deploy Application

    runs-on: ubuntu-latest

    needs: package


    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Checkout Source Code

        uses: actions/checkout@v4


      - name: Setup GitHub Pages

        uses: actions/configure-pages@v5


      - name: Upload Website

        uses: actions/upload-pages-artifact@v3

        with:

          path: .


      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
