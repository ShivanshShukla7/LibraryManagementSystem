<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Library Management System</h1>
        <p>Manage books easily and efficiently</p>
    </header>


    <div class="container">

        <!-- Add Book Section -->

        <section class="form-section">

            <h2>Add New Book</h2>

            <form id="bookForm">

                <input
                    type="text"
                    id="bookName"
                    placeholder="Enter Book Name"
                    required
                >

                <input
                    type="text"
                    id="authorName"
                    placeholder="Enter Author Name"
                    required
                >

                <input
                    type="text"
                    id="bookId"
                    placeholder="Enter Book ID"
                    required
                >

                <button type="submit">
                    Add Book
                </button>

            </form>

        </section>


        <!-- Search Section -->

        <section class="search-section">

            <h2>Search Books</h2>

            <input
                type="text"
                id="searchBook"
                placeholder="Search by book name..."
            >

        </section>


        <!-- Book List -->

        <section class="book-section">

            <h2>Available Books</h2>

            <table>

                <thead>

                    <tr>
                        <th>Book ID</th>
                        <th>Book Name</th>
                        <th>Author</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="bookList">

                </tbody>

            </table>

            <p id="emptyMessage">
                No books available.
            </p>

        </section>

    </div>


    <footer>

        <p>
            Library Management System
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
